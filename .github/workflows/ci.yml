name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - run: cargo check --target wasm32-unknown-unknown

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --target wasm32-unknown-unknown -- -D clippy::correctness -D clippy::suspicious

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all --check

  design-tokens:
    name: design tokens (no raw hex)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Raw color literals are only allowed in public/styles/variables.css
      # (the token definitions). Every other stylesheet and every Leptos
      # view! must reference a token via var(--...). See DESIGN.md.
      - name: Forbid raw hex colors outside variables.css
        run: |
          hits=$(grep -rInE '#[0-9a-fA-F]{6}\b|#[0-9a-fA-F]{3}\b' \
            public/styles src \
            --include='*.css' --include='*.rs' \
            | grep -v 'public/styles/variables.css' \
            | grep -v '&#39;' || true)
          if [ -n "$hits" ]; then
            echo "Raw hex color literals found outside variables.css:"
            echo "$hits"
            echo ""
            echo "Route colors through a design token (var(--...)) defined in"
            echo "public/styles/variables.css. See DESIGN.md."
            exit 1
          fi
          echo "OK: no raw hex outside variables.css"

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --lib

  build:
    name: trunk build (release)
    runs-on: ubuntu-latest
    needs: [check, clippy, fmt, test, design-tokens]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        run: cargo install trunk --locked

      # wasm-opt (binaryen) must be present: index.html enables it with
      # bulk-memory flags (see docs/perf-baseline.md) and the size budget
      # below is measured with wasm-opt active. Pin the exact binaryen
      # version instead of the distro package — Ubuntu's binaryen (108)
      # is too old to validate this toolchain's wasm (its validator rejects
      # the bulk-memory/nontrapping features with "all used features should
      # be allowed"). version_131 matches the local build the baseline was
      # measured with.
      - name: Install binaryen (wasm-opt) v131
        run: |
          curl -sL \
            https://github.com/WebAssembly/binaryen/releases/download/version_131/binaryen-version_131-x86_64-linux.tar.gz \
            -o /tmp/binaryen.tar.gz
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          echo "/tmp/binaryen-version_131/bin" >> "$GITHUB_PATH"
          rm /tmp/binaryen.tar.gz

      - name: Verify wasm-opt
        run: wasm-opt --version

      - name: Build
        run: trunk build --release

      # Bundle size budgets from docs/perf-baseline.md — a build that blows
      # past the ceiling fails here, so a size regression can't merge
      # silently. Ceilings (raw / gzip) are measured from the baseline and
      # carry ~10% headroom; update them only with a measured justification.
      - name: Enforce bundle size budget
        run: |
          wasm=$(ls dist/*.wasm)
          raw=$(stat -c %s "$wasm")
          gzip=$(gzip -9 -c "$wasm" | wc -c)
          echo "wasm raw: $raw (budget 2400000)"
          echo "wasm gzip: $gzip (budget 950000)"
          if [ "$raw" -gt 2400000 ]; then
            echo "::error::wasm exceeds raw budget: $raw > 2400000 (see docs/perf-baseline.md)"
            exit 1
          fi
          if [ "$gzip" -gt 950000 ]; then
            echo "::error::wasm exceeds gzip budget: $gzip > 950000 (see docs/perf-baseline.md)"
            exit 1
          fi
          echo "OK: within budget"
